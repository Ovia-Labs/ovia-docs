<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Official documentation for Ovia Labs, Ovia Protocol and ChartLabs Pulse." />
  <meta name="theme-color" content="#06080A" />
  <meta property="og:title" content="Ovia Labs Documentation" />
  <meta property="og:description" content="Explore the vision, products and infrastructure developed by Ovia Labs." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://docs.ovialabs.xyz/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://docs.ovialabs.xyz/og-image.png" />
  <meta property="og:url" content="https://docs.ovialabs.xyz" />
  <link rel="icon" type="image/png" href="/logo-white.png" />
  <title>Ovia Labs Documentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Open documentation menu" aria-controls="sidebar" aria-expanded="false">
    <span></span><span></span><span></span><b>Docs</b>
  </button>

  <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

  <div class="app">
    <aside id="sidebar" class="sidebar">
      <a class="brand" href="https://ovialabs.xyz" aria-label="Visit Ovia Labs">
        <img src="/logo-white.png" alt="Ovia Labs" />
        <span><strong>Ovia</strong><small>Documentation</small></span>
      </a>

      <div class="search-shell">
        <span aria-hidden="true">⌕</span>
        <input id="search" class="search" type="search" placeholder="Search documentation…" autocomplete="off" aria-label="Search documentation" />
        <kbd>ESC</kbd>
      </div>
      <div id="search-results" class="search-results" hidden></div>

      <nav id="nav" aria-label="Documentation navigation"></nav>

      <div class="sidebar-footer">
        <a href="https://ovialabs.xyz" target="_blank" rel="noopener noreferrer">Website</a>
        <a href="https://github.com/oviaprotocol/ovia-protocol" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://x.com/ovialabs" target="_blank" rel="noopener noreferrer">X</a>
        <a href="https://t.me/ovialabs" target="_blank" rel="noopener noreferrer">Telegram</a>
      </div>
    </aside>

    <main class="content">
      <div class="content-header">
        <div id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></div>
        <span id="page-status" class="page-status">Documentation</span>
      </div>

      <article id="content" class="docs-article" aria-live="polite"></article>

      <nav id="page-nav" class="page-nav" aria-label="Page navigation">
        <button id="prev-page" class="page-nav-button previous" type="button"></button>
        <button id="next-page" class="page-nav-button next" type="button"></button>
      </nav>

      <footer class="docs-footer">
        <span>Built by Ovia Labs.</span>
        <span>Trust should be engineered.</span>
      </footer>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
